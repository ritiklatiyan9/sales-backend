<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password | My Real Assets</title>
  <link rel="stylesheet" href="./legal.css">
  <link rel="stylesheet" href="./reset-password.css">
  <script src="./reset-password.js" defer></script>
</head>
<body>
  <main>
    <header>My Real Assets</header>
    <h1>Reset your password</h1>
    <p id="reset-status" role="status"></p>
    <form id="reset-form" class="card" method="post" hidden>
      <label for="mobile">Registered mobile number</label>
      <input id="mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="username" pattern="[6-9][0-9]{9}" maxlength="10" required>
      <label for="password">New password</label>
      <input id="password" name="new-password" type="password" autocomplete="new-password" minlength="12" aria-describedby="password-hint" required>
      <p id="password-hint">Use at least 12 characters.</p>
      <label for="confirmation">Confirm new password</label>
      <input id="confirmation" type="password" autocomplete="new-password" required>
      <button type="submit">Save password</button>
    </form>
    <noscript><p>Enable JavaScript in your browser to reset your password.</p></noscript>
  </main>
</body>
</html>
